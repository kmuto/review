name: Test with TeXLive

on:
  push:
    branches:
    - master
  pull_request:

jobs:
  build:

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2']
        os: [ubuntu-latest]
        texlive: ['2023', '2025', 'latest']
        include:
          - texlive: '2023'
            texlive_version: '2023'
            repository: https://texlive.info/historic/systems/texlive/2023/tlnet-final/
          - texlive: '2025'
            texlive_version: '2025'
            repository: https://texlive.info/historic/systems/texlive/2025/tlnet-final/
          - texlive: 'latest'
            texlive_version: 'latest'
            experimental: true
    steps:
    - uses: actions/checkout@v7
    - name: Install non-TeX tools in ubuntu
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -y -qq && sudo apt-get install -y -qq poppler-utils libfuse2
    - name: Install TeXLive ${{ matrix.texlive }}
      uses: zauguin/install-texlive@v4
      with:
        texlive_version: ${{ matrix.texlive_version }}
        repository: ${{ matrix.repository }}
        package_file: .github/tl_packages
    - name: Set up Japanese font maps
      run: kanji-config-updmap-sys haranoaji
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
    - name: use vendor's imagemagick
      run: |
        export PATH=${GITHUB_WORKSPACE}/vendor/imagemagick:${PATH}
        chmod 755 ${GITHUB_WORKSPACE}/vendor/imagemagick/magick
        ln -s ${GITHUB_WORKSPACE}/vendor/imagemagick/magick ${GITHUB_WORKSPACE}/vendor/imagemagick/compare
        which compare
        magick -version
        compare -version
    - name: fix ImageMagick policy.xml on Linux
      if: runner.os == 'Linux'
      run: sudo sed -i 's/none/read|write/g' /etc/ImageMagick-6/policy.xml
    - name: use Node.js 18.x
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Build and test with Rake
      run: |
        export PATH=${GITHUB_WORKSPACE}/vendor/imagemagick:${PATH}
        gem install bundler --no-document
        bundle install --retry 3
        bundle exec rake
